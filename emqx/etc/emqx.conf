## WeSense MQTT Hub - EMQX Configuration
## See https://docs.emqx.com/en/emqx/latest/configuration/configuration.html

## =============================================================================
## Node
## =============================================================================
node {
  name = "wesense@127.0.0.1"
  cookie = "CHANGE_ME_GENERATE_A_RANDOM_STRING"
  data_dir = "/opt/emqx/data"
}

## =============================================================================
## Cluster (single node for now)
## =============================================================================
cluster {
  name = wesense
  discovery_strategy = manual
}

## =============================================================================
## Dashboard
## =============================================================================
dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}

## =============================================================================
## MQTT Listeners
## =============================================================================

## Plain MQTT (consider disabling in production)
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

## MQTT over TLS (MQTTS)
## Enable via .env: TLS_MQTT_ENABLED=true
## Certificate paths set via .env (Let's Encrypt or self-signed)
## Server-only TLS — clients authenticate via username/password, not client certs.
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 1024000
  ssl_options {
    certfile = "/opt/emqx/etc/certs/fullchain.pem"
    keyfile = "/opt/emqx/etc/certs/privkey.pem"
    verify = verify_none
  }
}

## WebSocket (plain)
listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 1024000
}

## WebSocket over TLS (WSS)
## Enable via .env: TLS_WS_ENABLED=true
## Uses same certs as MQTTS listener above.
listeners.wss.default {
  bind = "0.0.0.0:8084"
  max_connections = 1024000
  ssl_options {
    certfile = "/opt/emqx/etc/certs/fullchain.pem"
    keyfile = "/opt/emqx/etc/certs/privkey.pem"
    verify = verify_none
  }
}

## =============================================================================
## Authentication
## =============================================================================

## Authentication is handled automatically by the init-auth.sh entrypoint script.
##
## How it works:
##   - Set MQTT_USER and MQTT_PASSWORD in .env to enable password authentication.
##   - Leave them empty for anonymous access (default — fine for local networks).
##   - The script generates a bootstrap CSV and configures EMQX via environment
##     variable overrides at startup. No manual dashboard setup needed.
##
## The block below is kept as a reference only. Do NOT uncomment it —
## init-auth.sh sets the equivalent config via EMQX_AUTHENTICATION__1__* env vars.
# authentication = [
#   {
#     mechanism = password_based
#     backend = built_in_database
#     user_id_type = username
#     password_hash_algorithm {
#       name = bcrypt
#     }
#   }
# ]

## =============================================================================
## Authorization
## =============================================================================

## Default: allow all (for Phase 1)
## Restrict in production
authorization {
  no_match = allow
  deny_action = ignore
  cache {
    enable = true
    max_size = 32
    ttl = 1m
  }
}

## =============================================================================
## System Topics ($SYS)
## =============================================================================
sys_topics {
  sys_msg_interval = 1m
  sys_heartbeat_interval = 30s
}

## =============================================================================
## Logging
## =============================================================================
log {
  file {
    enable = true
    level = warning
    path = "/opt/emqx/log/emqx.log"
    rotation_size = 50MB
    rotation_count = 10
  }
  console {
    enable = true
    level = info
  }
}

## =============================================================================
## MQTT Bridges — Tier 1 Forwarding
## =============================================================================
##
## These egress bridges forward all msh/# traffic to community Meshtastic
## infrastructure so that users who point their devices to mqtt.wesense.earth
## don't lose visibility on other maps.
##
## How it works:
##   - The rule_engine rule below matches all msh/# messages and forwards
##     them to each bridge. Both the rule and bridges must be defined for
##     forwarding to work from the config file.
##   - The downlink ingester subscribes directly to external brokers (not via
##     EMQX), so there is no loop risk. See MQTT_FORWARDING_AND_USER_ACCOUNTS.md
##     for the full loop prevention analysis.
##
## Bridges are Tier 1 — always on, forward unconditionally. Per-user
## forwarding (Tier 2/3) will be managed via the REST API in a later phase.

rule_engine {
  rules.forward_msh_to_bridges {
    sql = "SELECT * FROM 'msh/#'"
    actions = ["mqtt:meshtastic_fwd_1", "mqtt:meshtastic_fwd_2"]
    description = "Forward all msh/# traffic to configured Meshtastic bridges"
    enable = ${MESHTASTIC_FORWARDING_ENABLED}
  }
}

bridges {
  mqtt {
    ## Meshtastic forwarding slot 1: Liam Cottle Map (uplink-only)
    ## Toggle via .env: MESHTASTIC_FWD_1_ENABLED=true/false
    ## To change server/credentials, use the EMQX dashboard (Data Integration → Connectors)
    meshtastic_fwd_1 {
      enable = ${MESHTASTIC_FWD_1_ENABLED}
      server = "mqtt.meshtastic.liamcottle.net:1883"
      username = "uplink"
      password = "uplink"
      proto_ver = "v4"
      clean_start = true
      keepalive = "60s"
      clientid_prefix = "wesense-fwd1"
      egress {
        local {
          topic = "msh/#"
        }
        remote {
          topic = "${topic}"
          payload = "${payload}"
          qos = 1
          retain = false
        }
      }
      resource_opts {
        worker_pool_size = 1
        health_check_interval = "30s"
        auto_restart_interval = "30s"
      }
    }

    ## Meshtastic forwarding slot 2: Default Meshtastic MQTT
    ## Toggle via .env: MESHTASTIC_FWD_2_ENABLED=true/false
    ## To change server/credentials, use the EMQX dashboard (Data Integration → Connectors)
    meshtastic_fwd_2 {
      enable = ${MESHTASTIC_FWD_2_ENABLED}
      server = "mqtt.meshtastic.org:1883"
      username = "meshdev"
      password = "large4cats"
      proto_ver = "v4"
      clean_start = true
      keepalive = "60s"
      clientid_prefix = "wesense-fwd2"
      egress {
        local {
          topic = "msh/#"
        }
        remote {
          topic = "${topic}"
          payload = "${payload}"
          qos = 1
          retain = false
        }
      }
      resource_opts {
        worker_pool_size = 1
        health_check_interval = "30s"
        auto_restart_interval = "30s"
      }
    }
  }
}

