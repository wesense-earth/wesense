# WeSense Platform - Docker Compose Configuration
# See Deployment_Personas.md for full details
#
# Personas (set COMPOSE_PROFILES in .env):
#   contributor - Ingesters only (sends to remote MQTT hub)
#   station     - Full local stack (EMQX + ClickHouse + Ingesters + Respiro)
#   hub         - MQTT broker only (production mqtt.wesense.earth)
#   downlink    - Meshtastic global downlink (add to station, hub operators only)
#   observer    - Map + ClickHouse, receives data via Zenoh P2P
#   guardian    - Archive guardian (ClickHouse + OrbitDB + Storage Broker)
#   researcher  - ClickHouse + archives (future)
#
# Quick start:
#   1. Copy .env.sample to .env
#   2. Edit .env with your values
#   3. Run: docker compose --profile station up -d
#   4. Access Respiro map at http://localhost:3000

services:
  # ===========================================================================
  # Config Validator — fails fast if passwords are still set to CHANGEME
  # All services depend on this so nothing starts with default passwords.
  # ===========================================================================
  config-check:
    image: busybox:latest
    container_name: wesense-config-check
    profiles: ["hub", "station", "contributor", "observer", "downlink", "guardian"]
    environment:
      - CLICKHOUSE_ADMIN_PASSWORD=${CLICKHOUSE_ADMIN_PASSWORD:-}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - EMQX_DASHBOARD_PASSWORD=${EMQX_DASHBOARD_PASSWORD:-}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        ok=true

        # ClickHouse passwords — required for station/observer/guardian profiles
        case "$$COMPOSE_PROFILES" in
          *station*|*observer*|*guardian*)
            if [ -z "$$CLICKHOUSE_ADMIN_PASSWORD" ] || [ "$$CLICKHOUSE_ADMIN_PASSWORD" = "CHANGEME" ]; then
              echo "ERROR: CLICKHOUSE_ADMIN_PASSWORD must be set to a real password in .env (not empty, not CHANGEME)"
              ok=false
            fi
            if [ -z "$$CLICKHOUSE_PASSWORD" ] || [ "$$CLICKHOUSE_PASSWORD" = "CHANGEME" ]; then
              echo "ERROR: CLICKHOUSE_PASSWORD must be set to a real password in .env (not empty, not CHANGEME)"
              ok=false
            fi
            ;;
        esac

        # EMQX dashboard password — required for hub/station profiles
        case "$$COMPOSE_PROFILES" in
          *hub*|*station*)
            if [ -z "$$EMQX_DASHBOARD_PASSWORD" ] || [ "$$EMQX_DASHBOARD_PASSWORD" = "CHANGEME" ]; then
              echo "ERROR: EMQX_DASHBOARD_PASSWORD must be set to a real password in .env (not empty, not CHANGEME)"
              ok=false
            fi
            ;;
        esac

        # MQTT credentials — optional, but warn if partially set
        if [ -n "$$MQTT_USER" ] && [ -z "$$MQTT_PASSWORD" ]; then
          echo "WARNING: MQTT_USER is set but MQTT_PASSWORD is empty — MQTT auth will not be enabled"
        fi
        if [ -z "$$MQTT_USER" ] && [ -z "$$MQTT_PASSWORD" ]; then
          echo "NOTE: MQTT_USER/MQTT_PASSWORD not set — EMQX will allow anonymous connections"
        fi

        if [ "$$ok" = "false" ]; then
          echo "Fix the above errors in .env and try again."
          exit 1
        fi
        echo "Config OK."
    networks: []
    restart: "no"

  # ===========================================================================
  # EMQX - MQTT Broker
  # Profiles: hub, station
  #
  # Ports exposed to host are configured in .env — see "Host Port Mapping".
  # For additional ports (dashboard, WebSocket, TLS, ClickHouse), copy
  # docker-compose.override.yml.sample to docker-compose.override.yml.
  # ===========================================================================
  emqx:
    image: emqx/emqx:5.8.9
    container_name: wesense-emqx
    profiles: ["hub", "station"]
    user: "0:0"
    depends_on:
      config-check:
        condition: service_completed_successfully
    entrypoint: /opt/emqx/scripts/init-auth.sh
    command: ["/opt/emqx/bin/emqx", "foreground"]
    ports:
      - "${PORT_MQTT:-1883}:1883"
      - "${PORT_MQTT_TLS:-8883}:8883"
      - "${PORT_MQTT_WSS:-8084}:8084"
    volumes:
      - ${DATA_DIR:-./data}/emqx/data:/opt/emqx/data
      - ${DATA_DIR:-./data}/emqx/log:/opt/emqx/log
      - ${DATA_DIR:-./data}/certs:/opt/emqx/etc/certs:ro
      - ./emqx/etc/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/scripts/init-auth.sh:/opt/emqx/scripts/init-auth.sh:ro
    environment:
      # Run as this UID:GID (default 1000:1000 = emqx image default)
      # TrueNAS: set to 568:568 (apps:apps) in .env
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # MQTT authentication (opt-in: set both to enable, leave empty for anonymous)
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      # Dashboard password (overrides default admin/public)
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD:-public}
      # TLS listeners (disabled by default, enable in .env with certificates)
      - EMQX_LISTENERS__SSL__DEFAULT__ENABLED=${TLS_MQTT_ENABLED:-false}
      - EMQX_LISTENERS__WSS__DEFAULT__ENABLED=${TLS_WS_ENABLED:-false}
      - TZ=${TZ:-Pacific/Auckland}
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always
    networks:
      - wesense-net

  # ===========================================================================
  # Certbot — Automatic Let's Encrypt TLS Certificates
  # Profiles: tls
  # Obtains and auto-renews certificates via DNS-01 challenge (Cloudflare).
  # No port 80/443 needed. Writes certs to ${DATA_DIR}/certs/ (shared with EMQX).
  #
  # Enable with: COMPOSE_PROFILES=station,tls
  # Required env vars: TLS_DOMAIN, CLOUDFLARE_API_TOKEN
  # ===========================================================================
  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: wesense-certbot
    profiles: ["tls"]
    entrypoint: /scripts/certbot-entrypoint.sh
    volumes:
      - ${DATA_DIR:-./data}/certs:/certs
      - ${DATA_DIR:-./data}/certbot:/etc/letsencrypt
      - ./scripts/certbot-entrypoint.sh:/scripts/certbot-entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TLS_DOMAIN=${TLS_DOMAIN:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - CERTBOT_STAGING=${CERTBOT_STAGING:-false}
    restart: always

  # ===========================================================================
  # ClickHouse - Time Series Database
  # Profiles: station, observer
  # Creates both 'wesense' and 'wesense_respiro' databases on first start.
  # Services connect via Docker network internally. To access ClickHouse from
  # outside Docker (e.g., DBeaver, clickhouse-client), add a
  # docker-compose.override.yml with port mappings.
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: wesense-clickhouse
    profiles: ["station", "observer", "guardian"]
    depends_on:
      config-check:
        condition: service_completed_successfully
    # Set CLICKHOUSE_DATA_DIR in .env to store sensor data on a separate drive (e.g., HDD)
    # Defaults to DATA_DIR/clickhouse alongside other services
    volumes:
      - ${CLICKHOUSE_DATA_DIR:-${DATA_DIR:-./data}/clickhouse}/data:/var/lib/clickhouse
      - ${CLICKHOUSE_DATA_DIR:-${DATA_DIR:-./data}/clickhouse}/logs:/var/log/clickhouse-server
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-wesense}
      # Admin user — used by Docker image for init scripts and management
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_ADMIN_PASSWORD:?Set CLICKHOUSE_ADMIN_PASSWORD in .env}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      # App user — created by 00-create-app-user.sh on first start
      - CLICKHOUSE_APP_USER=${CLICKHOUSE_USER:-wesense}
      - CLICKHOUSE_APP_PASSWORD=${CLICKHOUSE_PASSWORD}
      - TZ=${TZ:-Pacific/Auckland}
    cap_add:
      - SYS_NICE            # Suppresses "get_mempolicy: Operation not permitted" NUMA warnings
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - wesense-net

  # ===========================================================================
  # Zenoh Router — P2P data distribution
  # Profiles: station
  # Provides a local Zenoh router for ingesters to publish signed readings.
  # Contributors connect to a remote router instead.
  # ===========================================================================
  zenohd:
    image: eclipse/zenoh:1.7.2
    container_name: wesense-zenohd
    profiles: ["station"]
    depends_on:
      config-check:
        condition: service_completed_successfully
    # Host networking enables Zenoh's multicast scouting for automatic
    # LAN peer discovery. Other containers reach zenohd via extra_hosts.
    network_mode: host
    volumes:
      - ./zenoh/zenohd.json5:/zenoh.json5:ro
      - ./zenoh/proxy-entrypoint.sh:/proxy-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/proxy-entrypoint.sh"]
    environment:
      - WESENSE_PROXY=${WESENSE_PROXY:-}
      - PORT_ZENOH=${WESENSE_PROXY_ZENOH_PORT:-${PORT_ZENOH:-7447}}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Storage Broker — HTTP API for sensor reading ingestion
  # Profiles: contributor, station, guardian
  # Receives readings from ingesters via POST /readings, geocodes, deduplicates,
  # and writes to ClickHouse and Iroh (via archive-replicator).
  # ===========================================================================
  storage-broker:
    image: ${STORAGE_BROKER_IMAGE:-ghcr.io/wesense-earth/wesense-storage-broker:${IMAGE_TAG:-latest}}
    container_name: wesense-storage-broker
    profiles: ["contributor", "station", "guardian"]
    deploy:
      resources:
        limits:
          memory: ${STORAGE_BROKER_MEM_LIMIT:-1G}
          cpus: '1'
    depends_on:
      config-check:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
        required: false
      archive-replicator:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # ClickHouse connection
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DB:-wesense}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-wesense}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_BATCH_SIZE=${CLICKHOUSE_BATCH_SIZE:-100}
      - CLICKHOUSE_FLUSH_INTERVAL=${CLICKHOUSE_FLUSH_INTERVAL:-10}
      # Signing and trust
      - KEY_DIR=/app/data/keys
      - TRUST_FILE=/app/data/trust_list.json
      # Iroh storage
      - ARCHIVE_REPLICATOR_URL=http://archive-replicator:4400
      # Archive schedule
      - ARCHIVE_INTERVAL_HOURS=${ARCHIVE_INTERVAL_HOURS:-4}
      - ARCHIVE_START_DATE=${ARCHIVE_START_DATE:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Pacific/Auckland}
    extra_hosts:
      - "wesense-orbitdb:host-gateway"
      - "archive-replicator:host-gateway"
    volumes:
      - ${DATA_DIR:-./data}/storage-broker/keys:/app/data/keys
      - ${DATA_DIR:-./data}/storage-broker/archives:/app/data/archives
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - wesense-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Archive Replicator — Distributed Blob Storage for Archives
  # Profiles: guardian
  # Rust service wrapping iroh-blobs + iroh-gossip. The storage broker POSTs archives
  # here. Handles BLAKE3 content-addressed storage
  # and gossip announcements to other nodes when new archives are available.
  # ===========================================================================
  archive-replicator:
    image: ${ARCHIVE_REPLICATOR_IMAGE:-ghcr.io/wesense-earth/wesense-archive-replicator:${IMAGE_TAG:-latest}}
    container_name: wesense-archive-replicator
    profiles: ["contributor", "station", "guardian"]
    # Host networking enables mDNS multicast for automatic LAN peer discovery.
    # Archive replicators on the same LAN find each other directly without OrbitDB.
    # Other containers reach the HTTP API (port 4400) via extra_hosts: host-gateway.
    network_mode: host
    deploy:
      resources:
        limits:
          memory: ${ARCHIVE_REPLICATOR_MEM_LIMIT:-2G}
          cpus: ${ARCHIVE_REPLICATOR_CPU_LIMIT:-2}
    depends_on:
      config-check:
        condition: service_completed_successfully
      orbitdb:
        condition: service_started
        required: false
    volumes:
      - ${DATA_DIR:-./data}/archive-replicator:/app/data
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - IROH_SIDECAR_PORT=4400
      - IROH_DATA_DIR=/app/data
      - IROH_GOSSIP_TOPIC=${IROH_GOSSIP_TOPIC:-wesense-archives}
      - IROH_QUIC_PORT=${PORT_IROH_QUIC:-4401}
      - IROH_STORE_SCOPE=${IROH_STORE_SCOPE:-*/*}
      - IROH_BOOTSTRAP_PEERS=${IROH_BOOTSTRAP_PEERS:-}
      - IROH_RELAY_URLS=${IROH_RELAY_URLS:-}
      - ORBITDB_URL=http://localhost:5200
      - ANNOUNCE_ADDRESS=${ANNOUNCE_ADDRESS:-}
      - WESENSE_PROXY=${WESENSE_PROXY:-}
      - WESENSE_PROXY_IROH_PORT=${WESENSE_PROXY_IROH_PORT:-}
      - RUST_LOG=${RUST_LOG:-wesense_archive_replicator=info}
      - TZ=${TZ:-Pacific/Auckland}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4400/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Meshtastic Ingester (Unified: public + community)
  # Profiles: contributor, station
  # Community mode (default): receives from a local Meshtastic node via EMQX
  # Public mode: subscribes to mqtt.meshtastic.org (hub operators only)
  # depends_on with required: false — waits for EMQX/ClickHouse in station
  # profile, skips gracefully in contributor profile (connects to remote hosts).
  # ===========================================================================
  ingester-meshtastic:
    image: ${INGESTER_MESHTASTIC_IMAGE:-ghcr.io/wesense-earth/wesense-ingester-meshtastic:${IMAGE_TAG:-latest}}
    container_name: wesense-ingester-meshtastic
    profiles: ["contributor", "station"]
    deploy:
      replicas: ${INGESTER_MESHTASTIC:-1}
    depends_on:
      config-check:
        condition: service_completed_successfully
      storage-broker:
        condition: service_healthy
      emqx:
        condition: service_healthy
        required: false
      clickhouse:
        condition: service_healthy
        required: false
      zenohd:
        condition: service_started
        required: false
      orbitdb:
        condition: service_started
        required: false
    extra_hosts:
      - "wesense-orbitdb:host-gateway"
      - "zenohd:host-gateway"
    volumes:
      - ${DATA_DIR:-./data}/ingester-meshtastic/cache:/app/cache
      - ${DATA_DIR:-./data}/ingester-meshtastic/logs:/app/logs
      - ${DATA_DIR:-./data}/ingester-meshtastic/keys:/app/data/keys
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Storage broker (receives all readings via HTTP)
      - GATEWAY_URL=http://storage-broker:8080
      # MQTT input (local EMQX where Meshtastic node pushes)
      - MQTT_BROKER=${MQTT_HOST:-emqx}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      # ClickHouse connection (read-only, used by ZenohQueryable)
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DB:-wesense}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-wesense}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      # MQTT output for publishing decoded messages
      - WESENSE_OUTPUT_BROKER=${MQTT_HOST:-emqx}
      - WESENSE_OUTPUT_PORT=${MQTT_PORT:-1883}
      - WESENSE_OUTPUT_USERNAME=${MQTT_USER}
      - WESENSE_OUTPUT_PASSWORD=${MQTT_PASSWORD}
      # OrbitDB registry
      - ORBITDB_ENABLED=${ORBITDB_ENABLED:-true}
      - ORBITDB_URL=${ORBITDB_URL:-http://wesense-orbitdb:5200}
      - ORBITDB_SYNC_INTERVAL=${ORBITDB_SYNC_INTERVAL:-3600}
      - ANNOUNCE_ADDRESS=${ANNOUNCE_ADDRESS:-}
      # Logging
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Pacific/Auckland}
    restart: always
    networks:
      - wesense-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Meshtastic Downlink Ingester (Global)
  # Profile: downlink (opt-in, combine with station)
  # Subscribes to mqtt.meshtastic.org and community servers worldwide.
  # Generates significant MQTT traffic — only run this if you are a hub operator
  # or intentionally collecting global Meshtastic environmental data.
  #
  # Enable with:  docker compose --profile station --profile downlink up -d
  # Or in .env:   COMPOSE_PROFILES=station,downlink
  #
  # Edit ingester-meshtastic-downlink/config/mqtt_regions.json to enable/disable
  # specific regions.
  # ===========================================================================
  ingester-meshtastic-downlink:
    image: ${INGESTER_MESHTASTIC_IMAGE:-ghcr.io/wesense-earth/wesense-ingester-meshtastic:${IMAGE_TAG:-latest}}
    container_name: wesense-ingester-meshtastic-downlink
    profiles: ["downlink"]
    depends_on:
      config-check:
        condition: service_completed_successfully
      storage-broker:
        condition: service_healthy
      emqx:
        condition: service_healthy
        required: false
      clickhouse:
        condition: service_healthy
        required: false
      zenohd:
        condition: service_started
        required: false
      orbitdb:
        condition: service_started
        required: false
    extra_hosts:
      - "wesense-orbitdb:host-gateway"
      - "zenohd:host-gateway"
    volumes:
      - ${DATA_DIR:-./data}/ingester-meshtastic-downlink/cache:/app/cache
      - ${DATA_DIR:-./data}/ingester-meshtastic-downlink/logs:/app/logs
      - ./ingester-meshtastic-downlink/config:/app/config:ro
      - ${DATA_DIR:-./data}/ingester-meshtastic-downlink/keys:/app/data/keys
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - MESHTASTIC_MODE=downlink
      # Storage broker (receives all readings via HTTP)
      - GATEWAY_URL=http://storage-broker:8080
      # ClickHouse connection (read-only, used by ZenohQueryable)
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DB:-wesense}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-wesense}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      # MQTT output for publishing decoded messages
      - WESENSE_OUTPUT_BROKER=${MQTT_HOST:-emqx}
      - WESENSE_OUTPUT_PORT=${MQTT_PORT:-1883}
      - WESENSE_OUTPUT_USERNAME=${MQTT_USER}
      - WESENSE_OUTPUT_PASSWORD=${MQTT_PASSWORD}
      # OrbitDB registry
      - ORBITDB_ENABLED=${ORBITDB_ENABLED:-true}
      - ORBITDB_URL=${ORBITDB_URL:-http://wesense-orbitdb:5200}
      - ORBITDB_SYNC_INTERVAL=${ORBITDB_SYNC_INTERVAL:-3600}
      - ANNOUNCE_ADDRESS=${ANNOUNCE_ADDRESS:-}
      # Logging
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Pacific/Auckland}
    restart: always
    networks:
      - wesense-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # WeSense Ingester (Unified: WiFi + LoRa + TTN webhook)
  # Profiles: contributor, station
  # Subscribes to wesense/v2/wifi/# and wesense/v2/lora/# topics
  # Optionally runs TTN webhook HTTP server (TTN_WEBHOOK_ENABLED=true)
  # ===========================================================================
  ingester-wesense:
    image: ${INGESTER_WESENSE_IMAGE:-ghcr.io/wesense-earth/wesense-ingester-wesense:${IMAGE_TAG:-latest}}
    container_name: wesense-ingester-wesense
    profiles: ["contributor", "station"]
    deploy:
      replicas: ${INGESTER_WESENSE:-1}
      resources:
        limits:
          memory: ${INGESTER_WESENSE_MEM_LIMIT:-1G}
          cpus: '1'
    depends_on:
      config-check:
        condition: service_completed_successfully
      storage-broker:
        condition: service_healthy
      emqx:
        condition: service_healthy
        required: false
      clickhouse:
        condition: service_healthy
        required: false
      zenohd:
        condition: service_started
        required: false
      orbitdb:
        condition: service_started
        required: false
    extra_hosts:
      - "wesense-orbitdb:host-gateway"
      - "zenohd:host-gateway"
    volumes:
      - ${DATA_DIR:-./data}/ingester-wesense/cache:/app/cache
      - ${DATA_DIR:-./data}/ingester-wesense/logs:/app/logs
      - ${DATA_DIR:-./data}/ingester-wesense/keys:/app/data/keys
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Storage broker (receives all readings via HTTP)
      - GATEWAY_URL=http://storage-broker:8080
      # MQTT input (subscribe to sensor topics)
      - MQTT_BROKER=${MQTT_HOST:-emqx}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      # ClickHouse connection (read-only, used by ZenohQueryable)
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DB:-wesense}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-wesense}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      # MQTT output for decoded messages
      - WESENSE_OUTPUT_BROKER=${MQTT_HOST:-emqx}
      - WESENSE_OUTPUT_PORT=${MQTT_PORT:-1883}
      - WESENSE_OUTPUT_USERNAME=${MQTT_USER}
      - WESENSE_OUTPUT_PASSWORD=${MQTT_PASSWORD}
      # OrbitDB registry
      - ORBITDB_ENABLED=${ORBITDB_ENABLED:-true}
      - ORBITDB_URL=${ORBITDB_URL:-http://wesense-orbitdb:5200}
      - ORBITDB_SYNC_INTERVAL=${ORBITDB_SYNC_INTERVAL:-3600}
      - ANNOUNCE_ADDRESS=${ANNOUNCE_ADDRESS:-}
      # TTN webhook (optional)
      - TTN_WEBHOOK_ENABLED=${TTN_WEBHOOK_ENABLED:-false}
      - TTN_WEBHOOK_PORT=${TTN_WEBHOOK_PORT:-5000}
      # Logging
      - DEBUG=${DEBUG:-false}
      - TZ=${TZ:-Pacific/Auckland}
    # TTN webhook port — uncomment if receiving The Things Network uplinks
    # directly (not needed if using cloudflared tunnel or similar)
    # ports:
    #   - "${PORT_TTN_WEBHOOK:-5000}:5000"
    restart: always
    networks:
      - wesense-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Home Assistant Ingester
  # Profiles: contributor, station
  # Pulls sensor data from Home Assistant (WebSocket/REST)
  # Critical: loop prevention filters exclude WeSense ESP32 devices
  #
  # Requires config/config.yaml — see ingester-homeassistant/config/config.yaml.sample
  # Requires config/config.yaml — see ingester-homeassistant/config/config.yaml.sample
  # ===========================================================================
  ingester-homeassistant:
    image: ${INGESTER_HA_IMAGE:-ghcr.io/wesense-earth/wesense-ingester-homeassistant:${IMAGE_TAG:-latest}}
    container_name: wesense-ingester-homeassistant
    profiles: ["contributor", "station"]
    deploy:
      replicas: ${INGESTER_HOMEASSISTANT:-1}
    depends_on:
      config-check:
        condition: service_completed_successfully
      storage-broker:
        condition: service_healthy
      emqx:
        condition: service_healthy
        required: false
    volumes:
      - ./ingester-homeassistant/config:/app/config:ro
      - ${DATA_DIR:-./data}/ingester-homeassistant/logs:/app/logs
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Storage broker (receives all readings via HTTP)
      - GATEWAY_URL=http://storage-broker:8080
      # Home Assistant connection
      - HA_URL=${HA_URL:-http://homeassistant.local:8123}
      - HA_ACCESS_TOKEN=${HA_ACCESS_TOKEN}
      - NODE_NAME=${HA_NODE_NAME:-}
      # MQTT output for decoded messages
      - LOCAL_MQTT_BROKER=${MQTT_HOST:-emqx}
      - LOCAL_MQTT_PORT=${MQTT_PORT:-1883}
      # Options
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Pacific/Auckland}
    restart: always
    networks:
      - wesense-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Government Air Quality Ingester — New Zealand (Reference Stations)
  # Profile: govaq-nz (opt-in, combine with station or contributor)
  # Polls NZ regional council APIs for reference-grade readings.
  # Sources: ECan, Tasman, Nelson, Marlborough, Hawke's Bay, Gisborne,
  #          Horizons, West Coast (via Hilltop API).
  # Configure sources in ingester-govaq-nz/config/sources.json.
  #
  # Enable with:  docker compose --profile station --profile govaq-nz up -d
  # Or in .env:   COMPOSE_PROFILES=station,govaq-nz
  # ===========================================================================
  ingester-govaq-nz:
    image: ${INGESTER_GOVAQ_NZ_IMAGE:-ghcr.io/wesense-earth/wesense-ingester-govaq-nz:${IMAGE_TAG:-latest}}
    container_name: wesense-ingester-govaq-nz
    profiles: ["govaq-nz"]
    deploy:
      replicas: ${INGESTER_GOVAQ_NZ:-1}
    depends_on:
      config-check:
        condition: service_completed_successfully
      storage-broker:
        condition: service_healthy
      emqx:
        condition: service_healthy
        required: false
    volumes:
      - ./ingester-govaq-nz/config:/app/config:ro
      - ${DATA_DIR:-./data}/ingester-govaq-nz/cache:/app/cache
      - ${DATA_DIR:-./data}/ingester-govaq-nz/logs:/app/logs
      - ${DATA_DIR:-./data}/ingester-govaq-nz/keys:/app/data/keys
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Storage broker (receives all readings via HTTP)
      - GATEWAY_URL=http://storage-broker:8080
      # MQTT output for decoded messages
      - WESENSE_OUTPUT_BROKER=${MQTT_HOST:-emqx}
      - WESENSE_OUTPUT_PORT=${MQTT_PORT:-1883}
      - WESENSE_OUTPUT_USERNAME=${MQTT_USER}
      - WESENSE_OUTPUT_PASSWORD=${MQTT_PASSWORD}
      # Polling
      - GOVAQ_POLL_INTERVAL=${GOVAQ_POLL_INTERVAL:-600}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Pacific/Auckland}
    restart: always
    networks:
      - wesense-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Respiro - Environmental Sensor Map
  # Profiles: station, observer
  # Web dashboard displaying sensor data from ClickHouse.
  # Typically served behind a reverse proxy (SWAG, Caddy, Nginx Proxy Manager)
  # which handles TLS/letsencrypt — Respiro itself serves plain HTTP.
  # ===========================================================================
  respiro:
    image: ${RESPIRO_IMAGE:-ghcr.io/wesense-earth/wesense-respiro:${IMAGE_TAG:-latest}}
    container_name: wesense-respiro
    profiles: ["station", "observer"]
    ports:
      - "${PORT_RESPIRO:-3001}:3000"
    volumes:
      - ${DATA_DIR:-./data}/respiro:/app/data
      # Docker socket for container resource stats on the Stats dashboard.
      # Set DOCKER_SOCK=/var/run/docker.sock and DOCKER_STATS_ENABLED=true in .env.
      - ${DOCKER_SOCK:-/dev/null}:/var/run/docker.sock:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # ClickHouse connection
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DB:-wesense}
      - CLICKHOUSE_USERNAME=${CLICKHOUSE_USER:-wesense}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      # MQTT for real-time updates (optional)
      - MQTT_BROKER_URL=mqtt://${MQTT_HOST:-emqx}:${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC_FILTER=wesense/decoded/#
      # Server
      - PORT=3000
      - HOST=0.0.0.0
      # Zenoh P2P API (optional — enables /api/p2p/* endpoints)
      - ZENOH_API_URL=${ZENOH_API_URL:-http://zenoh-api:5100}
      # OrbitDB API (optional — enables /api/stats/orbitdb|nodes|trust endpoints)
      - ORBITDB_URL=${ORBITDB_URL:-http://wesense-orbitdb:5200}
      # Storage Broker API (enables archive stats panel in Stats view)
      - GATEWAY_URL=http://storage-broker:8080
      # Archive Replicator API (optional — enables /api/stats/iroh endpoint)
      - ARCHIVE_REPLICATOR_URL=${ARCHIVE_REPLICATOR_URL:-http://archive-replicator:4400}
      # Live Transport API (optional — enables /api/stats/zenoh-bridge endpoint)
      - LIVE_TRANSPORT_URL=${LIVE_TRANSPORT_URL:-http://live-transport:5300}
      # Container resource stats (optional — requires Docker socket mount below)
      - DOCKER_STATS_ENABLED=${DOCKER_STATS_ENABLED:-false}
      - DOCKER_STATS_CONTAINER_PREFIX=${DOCKER_STATS_CONTAINER_PREFIX:-wesense}
      # Map centre — auto-detects from sensor data by default.
      # Uncomment to override (values from .env if set).
      # - MAP_CENTER_LAT=${MAP_CENTER_LAT:--36.848}
      # - MAP_CENTER_LNG=${MAP_CENTER_LNG:-174.763}
      # - MAP_ZOOM_LEVEL=${MAP_ZOOM_LEVEL:-10}
      - TZ=${TZ:-Pacific/Auckland}
    depends_on:
      config-check:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      zenoh-api:
        condition: service_started
        required: false
      orbitdb:
        condition: service_started
        required: false
    extra_hosts:
      - "wesense-orbitdb:host-gateway"
      - "archive-replicator:host-gateway"
    restart: always
    networks:
      - wesense-net

  # ===========================================================================
  # Deployment Classifier
  # Profiles: station
  # Analyses sensor behaviour (variance, weather correlation, temp range) to
  # classify devices as indoor/outdoor/device/mobile etc. Runs on a cron
  # schedule (default: every 12 hours). Uses Open-Meteo API for weather data.
  # ===========================================================================
  deployment-classifier:
    image: ${CLASSIFIER_IMAGE:-ghcr.io/wesense-earth/wesense-deployment-classifier:${IMAGE_TAG:-latest}}
    container_name: wesense-deployment-classifier
    profiles: ["station"]
    depends_on:
      config-check:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}/deployment-classifier/reports:/app/reports
      - ${DATA_DIR:-./data}/deployment-classifier/logs:/app/logs
      - ${DATA_DIR:-./data}/deployment-classifier/data:/app/data
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # ClickHouse connection (includes protocol)
      - CLICKHOUSE_HOST=http://${CLICKHOUSE_HOST:-clickhouse}:${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-wesense}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DB:-wesense}
      # Classifier settings
      - CLASSIFIER_MODE=scheduler
      - CLASSIFIER_SCHEDULE=${CLASSIFIER_SCHEDULE:-0 */12 * * *}
      - RUN_ON_STARTUP=${CLASSIFIER_RUN_ON_STARTUP:-true}
      - DRY_RUN=${CLASSIFIER_DRY_RUN:-false}
      - TZ=${TZ:-Pacific/Auckland}
    restart: always
    networks:
      - wesense-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # OrbitDB — Distributed Node Registry & Trust Sync
  # Profiles: station, observer
  # Helia (IPFS) + OrbitDB for automated peer discovery and trust list
  # replication. Handles: node registry, trust sync, store scope tracking.
  # Port 4002 for libp2p peer connections (OrbitDB replication only).
  # HTTP API (5200) is internal to Docker network only.
  # ===========================================================================
  orbitdb:
    image: ${ORBITDB_IMAGE:-ghcr.io/wesense-earth/wesense-orbitdb:${IMAGE_TAG:-latest}}
    container_name: wesense-orbitdb
    profiles: ["station", "observer", "bootstrap", "guardian"]
    # Host networking is required for libp2p peer discovery:
    #   - LAN: mDNS multicast needs the real network interface (Docker bridge isolates it)
    #   - WAN: DHT provider records need a routable address
    # Other containers reach the HTTP API (port 5200) via extra_hosts: host-gateway.
    network_mode: host
    deploy:
      resources:
        limits:
          memory: ${ORBITDB_MEM_LIMIT:-2G}
          cpus: ${ORBITDB_CPU_LIMIT:-2}
    volumes:
      - ${DATA_DIR:-./data}/orbitdb:/app/data
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PORT=5200
      - LIBP2P_PORT=${PORT_ORBITDB_P2P:-4002}
      - DATA_DIR=/app/data
      - ANNOUNCE_ADDRESS=${ANNOUNCE_ADDRESS:-}
      - ORBITDB_BOOTSTRAP_PEERS=${ORBITDB_BOOTSTRAP_PEERS:-bootstrap.wesense.earth}
      - TZ=${TZ:-Pacific/Auckland}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Live Transport — Bidirectional MQTT ↔ Zenoh Bridge
  # Profiles: station, observer
  # Outbound: subscribes to MQTT decoded readings from all local ingesters,
  # signs them, and publishes to the Zenoh P2P network.
  # Inbound: subscribes to Zenoh, verifies signatures, writes to ClickHouse.
  # This is the single point where MQTT meets Zenoh — ingesters don't need
  # to know about Zenoh at all.
  # ===========================================================================
  live-transport:
    image: ${LIVE_TRANSPORT_IMAGE:-ghcr.io/wesense-earth/wesense-live-transport:${IMAGE_TAG:-latest}}
    container_name: wesense-live-transport
    profiles: ["station", "observer"]
    depends_on:
      config-check:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      zenohd:
        condition: service_started
        required: false
      orbitdb:
        condition: service_started
        required: false
    extra_hosts:
      - "wesense-orbitdb:host-gateway"
      - "zenohd:host-gateway"
    volumes:
      - ${DATA_DIR:-./data}/live-transport/data:/app/data
      - ${DATA_DIR:-./data}/live-transport/logs:/app/logs
      # Local ingester keys (read-only) — used for self-echo filtering
      - ${DATA_DIR:-./data}/ingester-wesense/keys:/app/local-keys/wesense:ro
      - ${DATA_DIR:-./data}/ingester-meshtastic/keys:/app/local-keys/meshtastic:ro
      - ${DATA_DIR:-./data}/ingester-meshtastic-downlink/keys:/app/local-keys/meshtastic-downlink:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Zenoh connection (client mode — station: local zenohd, observer: remote router)
      - ZENOH_ENABLED=true
      - ZENOH_MODE=${ZENOH_MODE:-client}
      - ZENOH_ROUTERS=${ZENOH_ROUTERS:-tcp/zenohd:7447}
      - ZENOH_SUBSCRIBE_KEY=${ZENOH_SUBSCRIBE_KEY:-wesense/v2/live/**}
      - ZENOH_KEY_DIR=/app/data/keys
      # MQTT outbound bridge (subscribe to decoded readings, forward to Zenoh)
      - MQTT_BRIDGE_ENABLED=${MQTT_BRIDGE_ENABLED:-true}
      - MQTT_BROKER=${MQTT_HOST:-emqx}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_SUBSCRIBE_TOPIC=${MQTT_SUBSCRIBE_TOPIC:-wesense/decoded/#}
      # ClickHouse connection (local database)
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DB:-wesense}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-wesense}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_BATCH_SIZE=${CLICKHOUSE_BATCH_SIZE:-100}
      - CLICKHOUSE_FLUSH_INTERVAL=${CLICKHOUSE_FLUSH_INTERVAL:-10}
      # Trust store
      - TRUST_FILE=/app/data/trust_list.json
      # OrbitDB registry (trust sync only — bridge is an observer, not a registrant)
      - ORBITDB_ENABLED=${ORBITDB_ENABLED:-true}
      - ORBITDB_URL=${ORBITDB_URL:-http://wesense-orbitdb:5200}
      - ORBITDB_SYNC_INTERVAL=${ORBITDB_SYNC_INTERVAL:-3600}
      # WAN peer discovery (registers zenoh_endpoint in OrbitDB for remote bridges)
      - ANNOUNCE_ADDRESS=${ANNOUNCE_ADDRESS:-}
      - ZENOH_LAN_ADDRESS=${ZENOH_LAN_ADDRESS:-}
      - WESENSE_PROXY=${WESENSE_PROXY:-}
      - PORT_ZENOH=${PORT_ZENOH:-7447}
      # Stats API
      - BRIDGE_API_PORT=${LIVE_TRANSPORT_API_PORT:-5300}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Pacific/Auckland}
    restart: always
    networks:
      - wesense-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Zenoh API — HTTP Frontend for Distributed Queries
  # Profiles: station, observer
  # Translates REST requests into Zenoh distributed queries.
  # Respiro calls these endpoints to show P2P data.
  # ===========================================================================
  zenoh-api:
    image: ${ZENOH_API_IMAGE:-ghcr.io/wesense-earth/wesense-zenoh-api:${IMAGE_TAG:-latest}}
    container_name: wesense-zenoh-api
    profiles: ["station", "observer"]
    depends_on:
      config-check:
        condition: service_completed_successfully
      zenohd:
        condition: service_started
        required: false
    extra_hosts:
      - "zenohd:host-gateway"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Zenoh connection
      - ZENOH_ENABLED=true
      - ZENOH_MODE=${ZENOH_MODE:-client}
      - ZENOH_ROUTERS=${ZENOH_ROUTERS:-tcp/zenohd:7447}
      # Query settings
      - ZENOH_QUERY_TIMEOUT=${ZENOH_QUERY_TIMEOUT:-5.0}
      - ZENOH_QUERY_KEY=${ZENOH_QUERY_KEY:-wesense/v2/live/**}
      - FLASK_PORT=5100
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Pacific/Auckland}
    volumes:
      - ${DATA_DIR:-./data}/zenoh-api/logs:/app/logs
    restart: always
    networks:
      - wesense-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# =============================================================================
# Networks
# =============================================================================
networks:
  wesense-net:
    driver: bridge
    enable_ipv6: ${ENABLE_IPV6:-false}
  # For connecting to external networks (e.g., SWAG reverse proxy)
  # Uncomment if you have a proxy-net network (e.g., from SWAG/Nginx Proxy Manager)
  # proxy-net:
  #   external: true
